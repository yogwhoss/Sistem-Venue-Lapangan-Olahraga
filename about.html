<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Booking</title>
<link rel="stylesheet" href="form.css"
</head>
<body>

<div class="top-bar"></div>

<div class="page">
    <form class="card" method="POST" action="#">
        <h2>Form Booking</h2>

        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama anda">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Masukkan email anda">

        <div class="row">
            <div class="col">
                <label for="Jam_Mulai">Jam mulai</label>
                <input type="date" id="Jam_Mulai" name="Jam_Mulai">
            </div>
            <div class="col">
                <label for="Jam_Selesai">Jam Selesai</label>
                <input type="date" id="Jam_Selesai" name="Jam_Selesai">
            </div>
        </div>

        <label for="jumlah_Lapangan">Jumlah Lapangan</label>
        <input type="number" id="jumlah Lapangan" name="jumlah_Lapangan" value="1" min="1">

        <button type="submit">Pesan Sekarang</button>
    </form>
</div>

<div class="bottom-bar"></div>

</body>
</html>
