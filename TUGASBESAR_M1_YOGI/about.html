<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Pelanggan & Member</title>
</head>
<body>

<div class="card">
    <h1>Pelanggan &amp; Member</h1>
    <h2>Form Tambah Pelanggan</h2>

    <form id="formPelanggan">
        <div class="field">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="row">
            <div class="field">
                <label for="telepon">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon" required>
            </div>
            <div class="field">
                <label for="level">Level Member</label>
                <select id="level" name="level" required>
                    <option value="">Pilih...</option>
                    <option value="Basic">Basic</option>
                    <option value="Gold">Gold</option>
                    <option value="VIP">VIP</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label for="alamat">Alamat</label>
            <input type="text" id="alamat" name="alamat" required>
        </div>

        <button type="submit">Tambah Pelanggan</button>
    </form>
</div>

<div class="card">
    <h2 class="judul-tabel">Data Pelanggan</h2>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Telepon</th>
                    <th>Level Member</th>
                    <th>Alamat</th>
                </tr>
            </thead>
            <tbody id="tabelPelanggan">
                <tr id="barisKosong">
                    <td colspan="5">Belum ada data</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('formPelanggan');
    const tabel = document.getElementById('tabelPelanggan');

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const kosong = document.getElementById('barisKosong');
        if (kosong) kosong.remove();

        const data = new FormData(form);
        const baris = document.createElement('tr');

        ['nama', 'email', 'telepon', 'level', 'alamat'].forEach(function (field) {
            const td = document.createElement('td');
            td.textContent = data.get(field);
            baris.appendChild(td);
        });

        tabel.appendChild(baris);
        form.reset();
    });
</script>

</body>
</html>
