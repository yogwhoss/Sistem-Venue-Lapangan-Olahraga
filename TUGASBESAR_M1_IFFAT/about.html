<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Rental Alat Olahraga</title>
</head>
<body>

<div class="header">
    <h1>RENTAL ALAT OLAHRAGA</h1>
    <p>Master data perlengkapan olahraga sewa</p>
</div>

<div class="isi">

    <div class="kolom-form">
        <h2>Tambah Alat</h2>
        <form id="formAlat">
            <label for="nama">Nama Alat</label>
            <input type="text" id="nama" placeholder="Raket, Bola, Rompi..." required>

            <label for="kondisi">Kondisi</label>
            <select id="kondisi" required>
                <option value="">Pilih...</option>
                <option value="Baik">Baik</option>
                <option value="Perlu Perbaikan">Perlu Perbaikan</option>
                <option value="Rusak">Rusak</option>
            </select>

            <label for="tarif">Tarif Sewa (Rp / jam)</label>
            <input type="number" id="tarif" min="0" placeholder="contoh: 15000" required>

            <label for="stok">Jumlah Stok</label>
            <input type="number" id="stok" min="1" required>

            <button type="submit">Simpan</button>
        </form>
    </div>

    <div class="kolom-tabel">
        <h2>Daftar Alat</h2>
        <div class="bungkus">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Alat</th>
                        <th>Kondisi</th>
                        <th>Tarif Sewa</th>
                        <th>Stok</th>
                    </tr>
                </thead>
                <tbody id="daftar">
                    <tr id="kosong">
                        <td colspan="5">Belum ada data</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    var form = document.getElementById('formAlat');
    var daftar = document.getElementById('daftar');
    var no = 1;

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        var kosong = document.getElementById('kosong');
        if (kosong) kosong.remove();

        var tarif = Number(document.getElementById('tarif').value);

        var isi = [
            no,
            document.getElementById('nama').value,
            document.getElementById('kondisi').value,
            'Rp ' + tarif.toLocaleString('id-ID'),
            document.getElementById('stok').value
        ];

        var tr = document.createElement('tr');
        isi.forEach(function (nilai) {
            var td = document.createElement('td');
            td.textContent = nilai;
            tr.appendChild(td);
        });
        daftar.appendChild(tr);

        no++;
        form.reset();
    });
</script>

</body>
</html>
